[workspace]
members = ["crates/*", "src-tauri"]
default-members = ["crates/*"]
# Third-party code built as it is upstream; see vendor/rbxport/VENDORED.md.
exclude = ["vendor"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/Calvin-Zikakis/openCrate"
publish = false

[workspace.dependencies]
dunce = "1.0.5"
oc-paths = { path = "crates/oc-paths" }
oc-ingest = { path = "crates/oc-ingest" }
oc-publish = { path = "crates/oc-publish" }
oc-convert = { path = "crates/oc-convert" }
oc-lookup = { path = "crates/oc-lookup" }
oc-player = { path = "crates/oc-player" }
oc-tag = { path = "crates/oc-tag" }
oc-organize = { path = "crates/oc-organize" }
rbl-db = { path = "vendor/rbxport/crates/rbl-db" }
lofty = "0.25.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
unicode-normalization = "0.1"
tempfile = "3"
percent-encoding = "2.3"
quick-xml = "0.42"
sha2 = "0.11"
rustfft = "6.4"
symphonia = { version = "0.6.1", default-features = false, features = ["aiff", "wav", "pcm", "flac", "mp3", "aac", "alac", "isomp4"] }
cpal = "0.18"
ureq = { version = "3.4", default-features = false, features = ["rustls", "json"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Nothing may panic across the IPC boundary.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
print_stdout = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Not "abort": a panic in one command is caught at the IPC boundary instead of ending the app.
panic = "unwind"
strip = "symbols"

[profile.dev.package."*"]
# SQLite and the audio crates are unusably slow in a debug build otherwise.
opt-level = 2

[profile.perf]
inherits = "release"
debug = 1
strip = "none"
