name: Installers

# Started by hand only: builds unsigned installers for a test install. Not a release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            # A short absolute build folder keeps OpenSSL's build under Windows path limits.
            target: C:/t
            artifact: C:/t/release/bundle/nsis/*.exe
          - os: macos-latest
            bundles: app,dmg
            target: ${{ github.workspace }}/target
            artifact: ${{ github.workspace }}/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      # Absolute, because the Tauri CLI runs cargo from src-tauri and a relative path would land there.
      CARGO_TARGET_DIR: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Use Strawberry Perl for the OpenSSL build (Git Bash's Perl lacks modules it needs)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "OPENSSL_SRC_PERL=C:/Strawberry/perl/bin/perl.exe" >> $env:GITHUB_ENV
      - uses: Swatinem/rust-cache@v2
      - name: Install packages
        run: npm ci
      - name: Build the installer
        run: npm run tauri -- build --bundles ${{ matrix.bundles }}
      - name: Check that an installer was made
        shell: bash
        run: ls ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        with:
          name: openCrate-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
