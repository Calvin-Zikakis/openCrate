allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
allow-dbg-in-tests = true

too-many-lines-threshold = 150

# Product and service names as the docs spell them; ".." keeps Clippy's own list.
doc-valid-idents = ["openCrate", "SQLite", "SQLCipher", "MusicBrainz", "AcoustID", "Bandcamp", "Soulseek", "Navidrome", "AudioMuse", "AIFF", "FTS5", "IPC", ".."]
