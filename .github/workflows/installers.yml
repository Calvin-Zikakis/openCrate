name: Installers

# Started by hand only: builds unsigned installers for a test install. Not a release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            # A short absolute build folder keeps OpenSSL's build under Windows path limits.
            target: C:/t
            artifact: C:/t/release/bundle/nsis/*.exe
          - os: macos-latest
            bundles: app,dmg
            # Relative to the checkout. The matrix is read before the runner has one, so
            # github.workspace is empty here; the step below makes it absolute.
            target: target
            artifact: target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - name: Choose the build folder
        shell: bash
        # Absolute, because the Tauri CLI runs cargo from src-tauri and a relative path would land there.
        run: |
          case "${{ matrix.target }}" in
            /* | ?:/*) echo "CARGO_TARGET_DIR=${{ matrix.target }}" >> "$GITHUB_ENV" ;;
            *) echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/${{ matrix.target }}" >> "$GITHUB_ENV" ;;
          esac
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Use Strawberry Perl for the OpenSSL build (Git Bash's Perl lacks modules it needs)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "OPENSSL_SRC_PERL=C:/Strawberry/perl/bin/perl.exe" >> $env:GITHUB_ENV
      - uses: Swatinem/rust-cache@v2
        with:
          # Cache the folder the build actually uses; without this the Windows job cached an
          # empty "target" and rebuilt OpenSSL from source on every run.
          workspaces: ${{ matrix.os == 'windows-latest' && '. -> C:/t' || '. -> target' }}
          # One cache per platform for every installer run, rather than one per workflow trigger.
          shared-key: installers
          # A failed build still saves what it compiled, so the retry is not cold again.
          cache-on-failure: true
      - name: Install packages
        run: npm ci
      - name: Build the installer
        run: npm run tauri -- build --bundles ${{ matrix.bundles }}
      - name: Check that an installer was made
        shell: bash
        run: ls ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v7
        with:
          name: openCrate-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
