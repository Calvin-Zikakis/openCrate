# Dependabot opens one grouped pull request per ecosystem each week. The checks on
# that pull request still have to pass before it is merged.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # The vendored rbxport tree declares a workspace of its own, and Dependabot
    # expands its "crates/*" members against the wrong base and fails. Only that
    # file is skipped: the crates under it are path dependencies of this
    # workspace, so their manifests must stay visible for anything to resolve.
    exclude-paths:
      - "vendor/rbxport/Cargo.toml"
    groups:
      cargo:
        patterns: ["*"]
    open-pull-requests-limit: 2

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm:
        patterns: ["*"]
    # The Node major is pinned in .nvmrc; its types stay on the same line.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 2

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 1
