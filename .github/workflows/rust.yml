name: Rust foundation

# A pull request into main is checked on macOS. A published release, or a run started by hand,
# is checked on Windows as well. Pushes start nothing: the same checks run locally before every
# commit.
on:
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A run for a release or started by hand is never cancelled: it has a group of its own. On a
  # pull request only the newest commit is checked.
  group: rust-${{ github.workflow }}-${{ github.event_name != 'pull_request' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        # Windows is the slow runner: a pull request is checked on macOS only, a release on both.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["macos-latest"]' || '["windows-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    # SQLCipher and its OpenSSL are compiled from source so the build has no system dependency;
    # a warm cache takes far less.
    timeout-minutes: 45
    env:
      # A short build folder keeps OpenSSL's build under Windows path limits (as rbxport does).
      CARGO_TARGET_DIR: ${{ matrix.os == 'windows-latest' && 'C:/t' || 'target' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Build embedded frontend
        run: npm ci && npm run build
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Use Strawberry Perl for the OpenSSL build (Git Bash's Perl lacks modules it needs)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "OPENSSL_SRC_PERL=C:/Strawberry/perl/bin/perl.exe" >> $env:GITHUB_ENV
      - uses: Swatinem/rust-cache@v2
        with:
          # Cache the folder the build actually uses.
          workspaces: ${{ matrix.os == 'windows-latest' && '. -> C:/t' || '. -> target' }}
      - name: Format
        run: cargo fmt --all --check
      # The project optimises dependencies even in debug builds so audio decodes at full speed
      # locally; tests do not need that, and compiling them unoptimised is much faster.
      - name: Lint
        shell: bash
        run: cargo clippy --workspace --all-targets --locked --config 'profile.dev.package."*".opt-level=0' -- -D warnings
      # Compiling the tests builds every crate, so there is no separate build step.
      - name: Test
        shell: bash
        # Every crate's tests run even after one fails, so one run shows every failure.
        run: cargo test --workspace --locked --no-fail-fast --config 'profile.dev.package."*".opt-level=0'
