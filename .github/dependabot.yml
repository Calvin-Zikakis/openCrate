# Dependabot opens one grouped pull request per ecosystem each week. The checks on
# that pull request still have to pass before it is merged.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # The vendored rbxport tree declares a workspace of its own. Its members are
    # named one by one (see vendor/rbxport/VENDORED.md): with a glob, Dependabot
    # expanded them against the wrong folder and aborted. Excluding the folder
    # does not work either, since this workspace depends on those crates by path.
    groups:
      cargo:
        patterns: ["*"]
    open-pull-requests-limit: 2

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm:
        patterns: ["*"]
    # The Node major is pinned in .nvmrc; its types stay on the same line.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 2

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 1
